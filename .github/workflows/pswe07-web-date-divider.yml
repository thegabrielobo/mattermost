name: PSWE07 web date divider

on:
  push:
    branches: [GH-38666-sticky-date-divider]
  pull_request:
    branches: [pswe07-base]
    paths:
      - webapp/**
      - .github/workflows/pswe07-web-date-divider.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pswe07-web-date-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web lint types and date divider regression
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Use pinned npm tooling
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies and build shared packages
        run: npm ci --no-audit --no-fund
      - name: Lint the two issue files without fixing
        working-directory: webapp/channels
        run: >-
          ../node_modules/.bin/eslint
          src/components/post_view/post_list_virtualized/post_list_virtualized.tsx
          src/components/post_view/post_list_virtualized/post_list_virtualized.test.tsx
      - name: Check webapp TypeScript and project references
        id: types
        continue-on-error: true
        run: npm run check-types --workspace channels
      - name: Run date divider regression tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          npm run test --workspace channels -- \
            src/components/post_view/post_list_virtualized/post_list_virtualized.test.tsx \
            --ci --runInBand --json --outputFile=../test-results/date-divider.json
      - name: Preserve regression results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pswe07-web-date-divider-results
          path: webapp/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce TypeScript result
        if: ${{ !cancelled() && steps.types.outcome == 'failure' }}
        run: exit 1
